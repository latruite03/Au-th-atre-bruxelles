<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Au théâtre ce soir</title>
  <meta name="description" content="Calendrier des représentations — Région Bruxelles-Capitale">
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <h1 class="site-title">Au théâtre ce soir</h1>
      <p class="site-subtitle">Région Bruxelles-Capitale</p>
    </div>
  </header>

  <main>
    <div class="container" style="padding-top:3rem; padding-bottom:3rem;">

      <!-- Date picker -->
      <div class="date-section">
        <div class="date-section-inner">
          <span class="date-label">Choisissez une date</span>
          <input type="date" id="date-input" class="date-input">
        </div>
      </div>

      <!-- Theatre filter -->
      <div class="filters-section">
        <div class="filter-group">
          <label for="theatre-select" class="filter-label">Théâtre</label>
          <select id="theatre-select" class="filter-select">
            <option value="">Tous</option>
          </select>
        </div>
      </div>

      <!-- Results -->
      <div class="results-section">
        <h2 id="results-title" class="results-title">Spectacles du &hellip;</h2>
        <div id="results-container">
          <div class="spinner-wrap"><div class="spinner"></div></div>
        </div>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-text">Mise à jour hebdomadaire</div>
    </div>
  </footer>

  <!-- Supabase JS (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- App scripts -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
